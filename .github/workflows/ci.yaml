name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: ./go.mod
    
    # NilAway is only available as a golangci-lint module plugin, so build a
    # custom binary (see .custom-gcl.yml) instead of running the stock one.
    # Keep this version in sync with .custom-gcl.yml.
    - name: Build golangci-lint with NilAway
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
        $(go env GOPATH)/bin/golangci-lint custom

    - name: golangci-lint
      run: ./custom-gcl run ./...

    - name: Go Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build

    - name: Run Unit tests
      run: |
        go test -race -covermode atomic -coverprofile=covprofile ./usecase/ ./infrastructure/fetch/ ./infrastructure/persistence/

    - name: Install goveralls
      run: go install github.com/mattn/goveralls@latest

    - name: Send coverage
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: goveralls -coverprofile=covprofile -service=github
